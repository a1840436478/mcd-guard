name: 测试

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"  # Windows 英文控制台默认不是 UTF-8，中文日志会报编码错误

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 单元测试（零依赖，不需要 Token）
        run: python -m unittest discover -s tests
