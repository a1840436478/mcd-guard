<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="322" viewBox="0 0 1172 322" xml:space="preserve" font-family="'SFMono-Regular', Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace" font-size="14"><style>text{white-space:pre}@keyframes k0{0%,3.21%{opacity:0}3.71%,100%{opacity:1}}.l0{animation:k0 15.6s linear infinite}@keyframes k1{0%,3.21%{opacity:0}3.71%,100%{opacity:1}}.l1{animation:k1 15.6s linear infinite}@keyframes k2{0%,15.38%{opacity:0}15.88%,100%{opacity:1}}.l2{animation:k2 15.6s linear infinite}@keyframes k3{0%,16.67%{opacity:0}17.17%,100%{opacity:1}}.l3{animation:k3 15.6s linear infinite}@keyframes k4{0%,17.95%{opacity:0}18.45%,100%{opacity:1}}.l4{animation:k4 15.6s linear infinite}@keyframes k5{0%,24.36%{opacity:0}24.86%,100%{opacity:1}}.l5{animation:k5 15.6s linear infinite}@keyframes k6{0%,25.64%{opacity:0}26.14%,100%{opacity:1}}.l6{animation:k6 15.6s linear infinite}@keyframes k7{0%,32.05%{opacity:0}32.55%,100%{opacity:1}}.l7{animation:k7 15.6s linear infinite}@keyframes k8{0%,34.62%{opacity:0}35.12%,100%{opacity:1}}.l8{animation:k8 15.6s linear infinite}@keyframes k9{0%,39.74%{opacity:0}40.24%,100%{opacity:1}}.l9{animation:k9 15.6s linear infinite}@keyframes k10{0%,39.74%{opacity:0}40.24%,100%{opacity:1}}.l10{animation:k10 15.6s linear infinite}@keyframes k11{0%,44.87%{opacity:0}45.37%,100%{opacity:1}}.l11{animation:k11 15.6s linear infinite}@keyframes k12{0%,51.28%{opacity:0}51.78%,100%{opacity:1}}.l12{animation:k12 15.6s linear infinite}@keyframes k13{0%,51.28%{opacity:0}51.78%,100%{opacity:1}}.l13{animation:k13 15.6s linear infinite}@keyframes k14{0%,61.54%{opacity:0}62.04%,100%{opacity:1}}.l14{animation:k14 15.6s linear infinite}@keyframes k15{0%,61.54%{opacity:0}62.04%,100%{opacity:1}}.l15{animation:k15 15.6s linear infinite}</style><rect width="1172" height="322" rx="12" fill="#0d1117"/><rect x="16" y="16" width="560" height="290" rx="8" fill="#161b22"/><path d="M16 24a8 8 0 0 1 8-8h544a8 8 0 0 1 8 8v24h-560z" fill="#21262d"/><circle cx="32" cy="32.0" r="5" fill="#ff5f56"/><circle cx="50" cy="32.0" r="5" fill="#ffbd2e"/><circle cx="68" cy="32.0" r="5" fill="#27c93f"/><text x="296.0" y="37.0" fill="#8b949e" text-anchor="middle">Claude Code（AI 客户端）</text><rect x="596" y="16" width="560" height="290" rx="8" fill="#161b22"/><path d="M596 24a8 8 0 0 1 8-8h544a8 8 0 0 1 8 8v24h-560z" fill="#21262d"/><circle cx="612" cy="32.0" r="5" fill="#ff5f56"/><circle cx="630" cy="32.0" r="5" fill="#ffbd2e"/><circle cx="648" cy="32.0" r="5" fill="#27c93f"/><text x="876.0" y="37.0" fill="#8b949e" text-anchor="middle">麦麦护栏终端</text><text class="l0" x="32" y="70" fill="#58a6ff">你 › 我们部门 12 个人点明天的午饭，人民广场那家 24 小时的麦当劳，每人一个</text><text class="l1" x="32" y="92" fill="#58a6ff">  麦辣鸡腿汉堡，直接帮我下单。</text><text class="l2" x="32" y="114" fill="#d2a8ff">● query-nearby-stores / query-meals</text><text class="l3" x="612" y="70" fill="#3fb950">[放行] query-nearby-stores</text><text class="l4" x="612" y="92" fill="#3fb950">[放行] query-meals</text><text class="l5" x="32" y="136" fill="#d2a8ff">● calculate-price → 12 份 应付 ¥270.00</text><text class="l6" x="612" y="114" fill="#3fb950">[放行] calculate-price</text><text class="l7" x="32" y="158" fill="#d2a8ff">● create-order …等待护栏</text><text class="l8" x="612" y="136" fill="#8b949e">[核价] 官方试算 应付 ¥270.00</text><text class="l9" x="612" y="158" fill="#f85149">[拦截] 超过单笔上限 ¥100.00</text><text class="l10" x="612" y="180" fill="#f85149">       不弹确认，不发给麦当劳</text><text class="l11" x="32" y="180" fill="#f85149">● create-order ✗ 护栏已拦截：超过单笔上限 ¥100.00</text><text class="l12" x="32" y="202" fill="#c9d1d9">AI › 订单没有下成功：这单应付 ¥270.00，超过护栏的单笔上限 ¥100.00。护栏</text><text class="l13" x="32" y="224" fill="#c9d1d9">  要求被拦截后不重试、不拆单，所以我没有再提交。</text><text class="l14" x="32" y="246" fill="#c9d1d9">AI › 如果确实要下，请调高 policy.json 里的上限并重启护栏，提交后仍需你</text><text class="l15" x="32" y="268" fill="#c9d1d9">  在护栏终端确认。</text></svg>