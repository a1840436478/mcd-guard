near infinite}@keyframes k18{0%,54.02%{opacity:0}54.52%,100%{opacity:1}}.l18{animation:k18 17.4s linear infinite}@keyframes k19{0%,56.32%{opacity:0}56.82%,100%{opacity:1}}.l19{animation:k19 17.4s linear infinite}@keyframes k20{0%,59.77%{opacity:0}60.27%,100%{opacity:1}}.l20{animation:k20 17.4s linear infinite}@keyframes k21{0%,65.52%{opacity:0}66.02%,100%{opacity:1}}.l21{animation:k21 17.4s linear infinite}@keyframes k22{0%,65.52%{opacity:0}66.02%,100%{opacity:1}}.l22{animation:k22 17.4s linear infinite}</style><rect width="1172" height="388" rx="12" fill="#0d1117"/><rect x="16" y="16" width="560" height="356" rx="8" fill="#161b22"/><path d="M16 24a8 8 0 0 1 8-8h544a8 8 0 0 1 8 8v24h-560z" fill="#21262d"/><circle cx="32" cy="32.0" r="5" fill="#ff5f56"/><circle cx="50" cy="32.0" r="5" fill="#ffbd2e"/><circle cx="68" cy="32.0" r="5" fill="#27c93f"/><text x="296.0" y="37.0" fill="#8b949e" text-anchor="middle">Claude Code（AI 客户端）</text><rect x="596" y="16" width="560" height="356" rx="8" fill="#161b22"/><path d="M596 24a8 8 0 0 1 8-8h544a8 8 0 0 1 8 8v24h-560z" fill="#21262d"/><circle cx="612" cy="32.0" r="5" fill="#ff5f56"/><circle cx="630" cy="32.0" r="5" fill="#ffbd2e"/><circle cx="648" cy="32.0" r="5" fill="#27c93f"/><text x="876.0" y="37.0" fill="#8b949e" text-anchor="middle">麦麦护栏终端</text><text class="l0" x="32" y="70" fill="#58a6ff">你 › 帮我在上海人民广场附近找一家麦当劳，到店自取，点一个麦辣鸡腿汉堡单品</text><text class="l1" x="32" y="92" fill="#58a6ff">  ，直接帮我下单。</text><text class="l2" x="32" y="114" fill="#d2a8ff">● query-nearby-stores → 华旭国际大厦餐厅（144 米，24 小时）</text><text class="l3" x="612" y="70" fill="#3fb950">[放行] query-nearby-stores</text><text class="l4" x="32" y="136" fill="#d2a8ff">● query-meals → 麦辣鸡腿汉堡单品 1440</text><text class="l5" x="612" y="92" fill="#3fb950">[放行] query-meals</text><text class="l6" x="32" y="158" fill="#d2a8ff">● calculate-price → 应付 ¥22.50</text><text class="l7" x="612" y="114" fill="#3fb950">[放行] calculate-price</text><text class="l8" x="32" y="180" fill="#c9d1d9">AI › 现在提交下单，请到运行护栏的终端里确认。</text><text class="l9" x="32" y="202" fill="#d2a8ff">● create-order …等待护栏</text><text class="l10" x="612" y="136" fill="#8b949e">[核价] 官方试算 应付 ¥22.50</text><text class="l11" x="612" y="158" fill="#ffa657">══ 【麦麦护栏】AI 请求执行写操作 ══</text><text class="l12" x="612" y="180" fill="#ffa657">  操作：创建订单（create-order）</text><text class="l13" x="612" y="202" fill="#ffa657">  门店：1450713    方式：到店自取</text><text class="l14" x="612" y="224" fill="#ffa657">  餐品：麦辣鸡腿汉堡 x1</text><text class="l15" x="612" y="246" fill="#ffa657">  应付：¥22.50（官方试算）</text><text class="l16" x="612" y="268" fill="#ffa657">  今日已确认：¥0.00 / 上限 ¥200.00</text><text class="l17" x="612" y="290" fill="#d29922">输入 y 回车确认执行，输入其他内容拒绝</text><text class="l18" x="612" y="312" fill="#58a6ff">&gt; n</text><text class="l19" x="612" y="334" fill="#f85149">[拒绝] create-order 没有发给麦当劳</text><text class="l20" x="32" y="224" fill="#f85149">● create-order ✗ 用户在护栏终端拒绝</text><text class="l21" x="32" y="246" fill="#c9d1d9">AI › 订单没下成：你在护栏终端拒绝了「创建订单」，账户没有任何改动。按护栏</text><text class="l22" x="32" y="268" fill="#c9d1d9">  规则我不会自动重试。</text></svg>